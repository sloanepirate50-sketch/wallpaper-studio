<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tetris</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script src="fps.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // A self-playing game of Tetris. The AI picks the best rotation and column for each piece,
  // then visibly rotates, slides and drops it like a player would.
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const COLS = 10, ROWS = 20;
  const MOVE_MS = 75, SOFT_DROP_MS = 28, GRAVITY_MS = 450, CLEAR_MS = 380;
  const PIECES = {
    I: { color: '#22d3ee', cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
    O: { color: '#facc15', cells: [[1, 0], [2, 0], [1, 1], [2, 1]] },
    T: { color: '#a855f7', cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
    S: { color: '#22c55e', cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
    Z: { color: '#ef4444', cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
    J: { color: '#3b82f6', cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
    L: { color: '#f97316', cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
  };

  // Rotations: rotate (x, y) -> (-y, x) and shift back into positive space.
  const ROTS = {};
  for (const [k, p] of Object.entries(PIECES)) {
    const list = [];
    let cells = p.cells;
    for (let r = 0; r < 4; r++) {
      const minX = Math.min(...cells.map(c => c[0])), minY = Math.min(...cells.map(c => c[1]));
      const norm = cells.map(([x, y]) => [x - minX, y - minY]);
      list.push(norm);
      cells = cells.map(([x, y]) => [-y, x]);
    }
    ROTS[k] = list;
  }

  let W, H, dpr, cell, bx, by;
  let board, piece, next, bag = [], plan, dropping, clearing, over, overT;
  let score = 0, lines = 0, best = 0, flashT = 0, background, lastDrawn = '';
  let paused = false, last = 0, raf = 0, moveAcc = 0, fallAcc = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.width = Math.floor(innerWidth * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    cell = Math.floor(H * 0.86 / ROWS);
    bx = Math.floor((W - COLS * cell) / 2 - cell * 3);
    by = Math.floor((H - ROWS * cell) / 2);

    // Background, glowing well and grid never change: draw them once.
    background = document.createElement('canvas');
    background.width = W; background.height = H;
    const g = background.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b0820');
    bg.addColorStop(1, '#04050b');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);
    g.shadowColor = 'rgba(140, 100, 255, 0.8)';
    g.shadowBlur = 30 * dpr;
    g.fillStyle = 'rgba(12, 12, 28, 0.95)';
    g.fillRect(bx - 4 * dpr, by - 4 * dpr, COLS * cell + 8 * dpr, ROWS * cell + 8 * dpr);
    g.shadowBlur = 0;
    g.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    g.lineWidth = 1;
    for (let x = 1; x < COLS; x++) { g.beginPath(); g.moveTo(bx + x * cell, by); g.lineTo(bx + x * cell, by + ROWS * cell); g.stroke(); }
    for (let y = 1; y < ROWS; y++) { g.beginPath(); g.moveTo(bx, by + y * cell); g.lineTo(bx + COLS * cell, by + y * cell); g.stroke(); }
    lastDrawn = '';
  }

  // Redraw only when something visible changed (pieces move a few times a second, not 60).
  function visibleState() {
    return [piece && piece.type, piece && piece.x, piece && piece.y, piece && piece.rot, score, next,
            clearing ? Math.floor(clearing.t / 60) : -1, Math.ceil(flashT / 25), over ? 1 : 0].join(',');
  }

  function newGame() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    score = 0; lines = 0; over = false; clearing = null;
    next = draw7();
    spawn();
  }

  function draw7() {
    if (!bag.length) bag = Object.keys(PIECES).sort(() => Math.random() - 0.5);
    return bag.pop();
  }

  const cellsOf = (p) => ROTS[p.type][p.rot].map(([x, y]) => [x + p.x, y + p.y]);
  const fits = (p) => cellsOf(p).every(([x, y]) => x >= 0 && x < COLS && y < ROWS && (y < 0 || !board[y][x]));

  function spawn() {
    piece = { type: next, rot: 0, x: 3, y: 0 };
    next = draw7();
    if (!fits(piece)) { over = true; overT = 0; best = Math.max(best, score); return; }
    plan = choosePlacement(piece.type);
    dropping = false;
  }

  // ---------- AI: score every rotation/column with classic heuristics ----------
  function choosePlacement(type) {
    let bestScore = -Infinity, bestPlan = { rot: 0, x: 3 };
    for (let rot = 0; rot < 4; rot++) {
      const shape = ROTS[type][rot];
      const width = Math.max(...shape.map(c => c[0])) + 1;
      for (let x = 0; x + width <= COLS; x++) {
        const p = { type, rot, x, y: 0 };
        if (!fits(p)) continue;
        while (fits({ ...p, y: p.y + 1 })) p.y++;
        const s = evaluate(p) + Math.random() * 0.01;
        if (s > bestScore) { bestScore = s; bestPlan = { rot, x }; }
      }
    }
    return bestPlan;
  }

  function evaluate(p) {
    const g = board.map(r => r.slice());
    for (const [x, y] of cellsOf(p)) if (y >= 0) g[y][x] = 1;
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) if (g[y].every(Boolean)) { g.splice(y, 1); cleared++; }
    while (g.length < ROWS) g.unshift(Array(COLS).fill(null));

    const heights = [];
    let holes = 0;
    for (let x = 0; x < COLS; x++) {
      let y = 0;
      while (y < ROWS && !g[y][x]) y++;
      heights.push(ROWS - y);
      for (let yy = y + 1; yy < ROWS; yy++) if (!g[yy][x]) holes++;
    }
    const agg = heights.reduce((a, b) => a + b, 0);
    let bump = 0;
    for (let x = 0; x < COLS - 1; x++) bump += Math.abs(heights[x] - heights[x + 1]);
    return -0.51 * agg + 0.76 * cleared - 0.36 * holes - 0.18 * bump;
  }

  // ---------- Game loop ----------
  function update(ms) {
    flashT = Math.max(0, flashT - ms);
    if (over) {
      overT += ms;
      if (overT > 1800) newGame();
      return;
    }
    if (clearing) {
      clearing.t += ms;
      if (clearing.t >= CLEAR_MS) {
        for (const y of clearing.rows) board.splice(y, 1);
        for (let i = 0; i < clearing.rows.length; i++) board.unshift(Array(COLS).fill(null));
        clearing = null;
        spawn();
      }
      return;
    }

    // Steer toward the plan: rotate first, then slide, then drop fast.
    moveAcc += ms;
    while (!dropping && moveAcc >= MOVE_MS) {
      moveAcc -= MOVE_MS;
      if (piece.rot !== plan.rot) {
        const r = { ...piece, rot: (piece.rot + 1) % 4 };
        if (fits(r)) piece = r; else dropping = true;
      } else if (piece.x !== plan.x) {
        const m = { ...piece, x: piece.x + Math.sign(plan.x - piece.x) };
        if (fits(m)) piece = m; else dropping = true;
      } else dropping = true;
    }

    fallAcc += ms;
    const interval = dropping ? SOFT_DROP_MS : GRAVITY_MS;
    while (fallAcc >= interval) {
      fallAcc -= interval;
      const d = { ...piece, y: piece.y + 1 };
      if (fits(d)) piece = d;
      else { lock(); return; }
    }
  }

  function lock() {
    const color = PIECES[piece.type].color;
    for (const [x, y] of cellsOf(piece)) if (y >= 0) board[y][x] = color;
    const full = [];
    for (let y = 0; y < ROWS; y++) if (board[y].every(Boolean)) full.push(y);
    fallAcc = 0; moveAcc = 0;
    if (full.length) {
      const level = 1 + Math.floor(lines / 10);
      score += [0, 100, 300, 500, 800][full.length] * level;
      lines += full.length;
      clearing = { rows: full, t: 0 };
      if (full.length === 4) flashT = 500;
    } else spawn();
  }

  // ---------- Rendering ----------
  function block(px, py, size, color, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(px + 1, py + 1, size - 2, size - 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(px + 1, py + 1, size - 2, Math.max(2, size * 0.16));
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.fillRect(px + 1, py + size - 1 - size * 0.14, size - 2, size * 0.14);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.fillRect(px + size * 0.25, py + size * 0.25, size * 0.5, size * 0.5);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.drawImage(background, 0, 0);
    if (flashT > 0) {
      ctx.fillStyle = `rgba(160, 120, 255, ${flashT / 500 * 0.25})`;
      ctx.fillRect(0, 0, W, H);
    }

    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        const c = board[y][x];
        if (!c) continue;
        const flashing = clearing && clearing.rows.includes(y);
        if (flashing && Math.floor(clearing.t / 60) % 2 === 0) block(bx + x * cell, by + y * cell, cell, '#ffffff');
        else block(bx + x * cell, by + y * cell, cell, over ? '#3a3a4a' : c);
      }

    if (!over && !clearing && piece) {
      // Ghost piece where it will land.
      const ghost = { ...piece };
      while (fits({ ...ghost, y: ghost.y + 1 })) ghost.y++;
      ctx.strokeStyle = PIECES[piece.type].color;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 2 * dpr;
      for (const [x, y] of cellsOf(ghost)) if (y >= 0) ctx.strokeRect(bx + x * cell + 3, by + y * cell + 3, cell - 6, cell - 6);
      ctx.globalAlpha = 1;
      for (const [x, y] of cellsOf(piece)) if (y >= 0) block(bx + x * cell, by + y * cell, cell, PIECES[piece.type].color);
    }

    // Side panel: next piece and stats.
    const px = bx + COLS * cell + cell * 1.2;
    ctx.fillStyle = 'rgba(200, 180, 255, 0.75)';
    ctx.font = `600 ${Math.round(cell * 0.55)}px "Segoe UI", sans-serif`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText('NEXT', px, by);
    const small = cell * 0.8;
    for (const [x, y] of ROTS[next][0]) block(px + x * small, by + cell * 1.1 + y * small, small, PIECES[next].color);

    const stats = [['SCORE', score], ['LINES', lines], ['LEVEL', 1 + Math.floor(lines / 10)], ['BEST', Math.max(best, score)]];
    stats.forEach(([label, value], i) => {
      const y = by + cell * (4.4 + i * 2.3);
      ctx.fillStyle = 'rgba(200, 180, 255, 0.55)';
      ctx.font = `600 ${Math.round(cell * 0.45)}px "Segoe UI", sans-serif`;
      ctx.fillText(label, px, y);
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(cell * 0.75)}px Consolas, monospace`;
      ctx.fillText(String(value), px, y + cell * 0.55);
    });

    if (over) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(bx, by, COLS * cell, ROWS * cell);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.round(cell * 0.9)}px Consolas, monospace`;
      ctx.fillText('GAME OVER', bx + COLS * cell / 2, by + ROWS * cell / 2);
    }
  }

  function frame(now) {
    if (paused) { raf = 0; return; }
    const ms = Math.min(250, now - last);
    last = now;
    update(ms);
    const state = visibleState();
    if (state !== lastDrawn) { draw(); lastDrawn = state; }
    raf = requestAnimationFrame(frame);
  }

  window.wpPause = p => {
    paused = p;
    if (!p && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  };

  addEventListener('resize', resize);
  resize();
  newGame();
  last = performance.now();
  raf = requestAnimationFrame(frame);
</script>
</body>
</html>
